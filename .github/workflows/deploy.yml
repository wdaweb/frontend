name: Deploy Vue 3 Frontend to GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'client/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: read

concurrency:
  group: 'pages'
  cancel-in-progress: false # 遵循 GitHub 官方指引：不中斷進行中的部署，自動排隊發布以避免鎖定衝突

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Type Check
        run: npm run type-check

      - name: Run Unit Tests
        run: npm run test

      # 先取得 GitHub Pages 實際部署路徑（例：/frontend），供一般網址路由與資源路徑使用
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build Project
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://wdaweb.onrender.com/api/v1' }}
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './client/dist'

      # 先前的 Pages 部署若卡在「進行中」，新部署會被拒絕（due to in progress deployment）。
      # 部署前取消其他 commit 殘留的 github-pages 部署；已完成的部署取消會失敗，直接忽略。
      - name: Cancel Stuck Pages Deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=10" --jq '.[].sha' | sort -u); do
            [ "$sha" = "${{ github.sha }}" ] && continue
            if gh api -X POST "repos/${{ github.repository }}/pages/deployments/$sha/cancel" >/dev/null 2>&1; then
              echo "已取消卡住的 Pages 部署：$sha"
            fi
          done

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
