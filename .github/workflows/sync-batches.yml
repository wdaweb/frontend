name: Scheduled TaiwanJobs Batch Sync

# 每天定時自動同步台灣就業通最新期別資訊
on:
  schedule:
    # 台灣時間 08:00 (UTC 00:00)
    - cron: '0 0 * * *'
    # 台灣時間 17:00 (UTC 09:00)
    - cron: '0 9 * * *'
  workflow_dispatch: # 支援在 GitHub 網頁 Actions 介面手動隨時觸發測試

concurrency:
  group: 'taiwanjobs-sync'
  cancel-in-progress: true

jobs:
  sync-batches:
    name: Sync Course Batches
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Print Sync Start Info
        run: |
          echo "========================================================"
          echo "🚀 啟動台灣就業通前端課程期別自動同步作業"
          echo "⏰ 執行時間: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "========================================================"

      - name: Trigger Remote Backend Sync Endpoint
        id: render_sync
        run: |
          BASE_URL="${{ secrets.RENDER_API_BASE_URL }}"
          if [ -z "$BASE_URL" ]; then
            BASE_URL="https://wdaweb.onrender.com"
          fi

          # 密鑰只能來自 GitHub Secrets，未設定時直接失敗（不提供任何預設值）
          TOKEN="${{ secrets.CRON_SECRET_TOKEN }}"
          if [ -z "$TOKEN" ]; then
            echo "❌ 尚未於 GitHub Secrets 設定 CRON_SECRET_TOKEN，無法觸發同步。"
            exit 1
          fi

          TARGET_URL="${BASE_URL%/}/api/v1/cron/batches/sync"
          echo "📡 目標 API: $TARGET_URL"

          # 發送 POST 請求並等待伺服器回應（支援 Render 冷啟動等待最長 180s）
          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST "$TARGET_URL" \
            -H "X-Cron-Token: $TOKEN" \
            -H "Content-Type: application/json" \
            --retry 3 \
            --retry-delay 15 \
            --max-time 180)

          HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)

          echo "--------------------------------------------------------"
          echo "HTTP 狀態碼: $HTTP_CODE"
          echo "伺服器回應: $HTTP_BODY"
          echo "--------------------------------------------------------"

          if [ "$HTTP_CODE" -eq 200 ] && echo "$HTTP_BODY" | grep -Eq '"success":[[:space:]]*true'; then
            echo "🎉 恭喜！台灣就業通最新期別同步成功！"
          elif [ "$HTTP_CODE" -eq 200 ] && echo "$HTTP_BODY" | grep -q '冷卻中'; then
            echo "⏳ 同步作業進行中或冷卻中，本次略過。"
          elif [ "$HTTP_CODE" -eq 200 ]; then
            echo "⚠️ Render 直連台灣就業通失敗，準備嘗試從 GitHub Runner 備援抓取並推送..."
            echo "needs_fallback=true" >> "$GITHUB_OUTPUT"
          else
            echo "❌ 同步未成功（狀態碼: $HTTP_CODE），請檢查後端日誌或密鑰設定。"
            exit 1
          fi

      - name: Checkout for Fallback Crawler
        if: steps.render_sync.outputs.needs_fallback == 'true'
        uses: actions/checkout@v4

      - name: Setup Python for Fallback Crawler
        if: steps.render_sync.outputs.needs_fallback == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: server/requirements.txt

      - name: Fallback Fetch & Push to Render
        if: steps.render_sync.outputs.needs_fallback == 'true'
        env:
          CRON_SECRET_TOKEN: ${{ secrets.CRON_SECRET_TOKEN }}
          RENDER_API_BASE_URL: ${{ secrets.RENDER_API_BASE_URL || 'https://wdaweb.onrender.com' }}
          DEBUG: 'True'
        run: |
          pip install -q -r server/requirements.txt
          python server/manage.py sync_course_batches --push || {
            echo "❌ 備援連線亦無法建立至台灣就業通（政府網站可能阻擋海外雲端機房 IP）。"
            echo "💡 請於台灣本地網路環境設定 CRON_SECRET_TOKEN 後執行：python server/manage.py sync_course_batches --push"
            exit 1
          }
